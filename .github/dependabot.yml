version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows/ current. Dependabot
  # understands the "@<sha> # vX.Y.Z" convention and bumps both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
